[[capabilities]]
key = "clipboard_write"
description = "Allow plugins to copy generated text to the system clipboard."
issue_url = "https://github.com/lundmark/lera/issues/7"

[[capabilities]]
key = "file_export_write"
description = "Allow plugins to export user-requested text to a local file safely."
issue_url = "https://github.com/lundmark/lera/issues/8"

[[capabilities]]
key = "independent_plugin_window_visibility"
description = "Allow a plugin pane to be shown or hidden independently of the main client window."
issue_url = "https://github.com/lundmark/lera/issues/9"

[[capabilities]]
key = "interactive_plugin_pane_resize"
description = "Allow pointer-driven resizing of an individual plugin pane."
issue_url = "https://github.com/lundmark/lera/issues/10"

[[capabilities]]
key = "local_sound_playback"
description = "Allow plugins to play a configured local notification sound."
issue_url = "https://github.com/lundmark/lera/issues/11"

[[capabilities]]
key = "movable_plugin_pane_layout"
description = "Allow an individual plugin pane to be repositioned in the client layout."
issue_url = "https://github.com/lundmark/lera/issues/12"

[[capabilities]]
key = "per_pane_font_control"
description = "Allow a plugin to configure the font used by its own pane."
issue_url = "https://github.com/lundmark/lera/issues/13"

[[capabilities]]
key = "per_pane_pointer_callbacks"
description = "Allow a plugin pane to receive pointer interaction callbacks."
issue_url = "https://github.com/lundmark/lera/issues/14"

[[capabilities]]
key = "pointer_click_input"
description = "Allow plugin-rendered controls to receive pointer click input."
